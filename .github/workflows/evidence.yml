name: Evidence checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/*.test.mjs
      - run: node scripts/validate-evidence.mjs
      - name: Check upstream release and source drift
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-upstream-drift.mjs
